services:
  htfa-app:
    build:
      context: ../..
      dockerfile: tooling/docker/Dockerfile
    image: htfa.alpha.1101:latest
    container_name: htfa-app
    ports:
      - "8501:8501"
    volumes:
      # 数据持久化
      - ../../data:/app/data
      - ../../logs:/app/logs
      - ../../config:/app/config
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    networks:
      - htfa-network

networks:
  htfa-network:
    driver: bridge
