name: Daily UAE and energy supply refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/energy-supply.yml'
      - 'tooling/requirements/requirements-energy-collector.txt'
      - 'tooling/requirements/requirements-daily-collector.txt'
  schedule:
    # 09:00 Asia/Dubai (UTC+4), once per day.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Initialize an empty bucket key from the Git LFS baseline
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: htfa-snapshot-writer
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
      HTFA_EIA_API_KEY: ${{ secrets.HTFA_EIA_API_KEY }}
      HTFA_SNAPSHOT_BUCKET: ${{ vars.HTFA_SNAPSHOT_BUCKET }}
      HTFA_SNAPSHOT_ENDPOINT: ${{ vars.HTFA_SNAPSHOT_ENDPOINT }}
      HTFA_SNAPSHOT_REGION: ${{ vars.HTFA_SNAPSHOT_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tooling/requirements/requirements-daily-collector.txt
      - name: Install collection and workbook dependencies
        run: |
          python -m pip install -r tooling/requirements/requirements-daily-collector.txt
          python -m pip check
      - name: Restore validated raw download cache
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/htfa-snapshot/raw
          key: uae-assets-raw-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: uae-assets-raw-${{ runner.os }}-
      - name: Collect, validate and replace the published snapshot
        env:
          HTFA_UAE_DATA_DIR: ${{ runner.temp }}/htfa-snapshot
          BOOTSTRAP_SNAPSHOT: ${{ inputs.bootstrap && '--bootstrap' || '' }}
          HTFA_SNAPSHOT_ACCESS_KEY_ID: ${{ secrets.HTFA_SNAPSHOT_ACCESS_KEY_ID }}
          HTFA_SNAPSHOT_SECRET_ACCESS_KEY: ${{ secrets.HTFA_SNAPSHOT_SECRET_ACCESS_KEY }}
        run: |
          args=(--results-dir "$RUNNER_TEMP/daily-refresh")
          if [[ -n "$BOOTSTRAP_SNAPSHOT" ]]; then
            args+=(--bootstrap)
          fi
          python -m htfa.monitoring.uae.jobs.publish_snapshot "${args[@]}"
          printf 'Verified latest object storage snapshot.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Report every source status
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'daily-refresh' / 'summary.json'
          if not path.exists():
              raise SystemExit('Refresh did not produce a result; inspect collection logs.')
          result = json.loads(path.read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n| Source | Status |\n| --- | --- |\n')
              for name, source in result['sources'].items():
                  out.write(f"| {name} | {source.get('status', 'ok')} |\n")
                  for kind, detail in source.get('source_results', {}).items():
                      out.write(f"| energy/{kind} | {detail['status']} |\n")
          if result['status'] != 'ok':
              raise SystemExit('Some sources failed; validated successful sources were preserved. See artifacts for exact errors.')
      - name: Save source results and collection logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: daily-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily-refresh
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve reusable raw cache even when a source failed
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/htfa-snapshot/raw
          key: ${{ steps.raw-cache.outputs.cache-primary-key }}
