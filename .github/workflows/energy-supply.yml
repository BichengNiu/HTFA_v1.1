name: Daily UAE and energy supply refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/energy-supply.yml'
      - 'tooling/requirements/requirements-energy-collector.txt'
      - 'tooling/requirements/requirements-daily-collector.txt'
  schedule:
    # 09:00 Asia/Dubai (UTC+4), once per day.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: htfa-main-writer
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
      CF_RADAR_TOKEN: ${{ secrets.CF_RADAR_TOKEN }}
      COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      HTFA_EIA_API_KEY: ${{ secrets.HTFA_EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tooling/requirements/requirements-daily-collector.txt
      - name: Install collection and workbook dependencies
        run: |
          python -m pip install -r tooling/requirements/requirements-daily-collector.txt
          python -m pip check
      - name: Check source credentials
        shell: bash
        run: |
          for variable in CF_RADAR_TOKEN COMTRADE_API_KEY; do
            if [[ -z "${!variable}" ]]; then
              echo "::warning::$variable is missing; its source will retain the previous validated data. Configure Repository Secrets to enable it."
            fi
          done
      - name: Restore validated raw download cache
        uses: actions/cache@v4
        with:
          path: htfa/monitoring/uae/assets/raw
          key: uae-assets-raw-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: uae-assets-raw-${{ runner.os }}-
      - name: Collect, publish and verify the database and workbook together
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          publication_complete=false
          for attempt in 1 2; do
            git pull --ff-only origin main
            git lfs pull --include=htfa/monitoring/uae/assets/uae.duckdb
            base=$(git rev-parse HEAD)
            python -m htfa.jobs.uae_data.daily_refresh --results-dir "$RUNNER_TEMP/daily-refresh"
            git fetch origin main
            if [[ "$base" != "$(git rev-parse origin/main)" ]]; then
              git restore --source=HEAD -- htfa/monitoring/uae/assets/uae.duckdb htfa/monitoring/uae/assets/阿联酋.xlsx
              continue
            fi
            pwsh -NoProfile -File tooling/scripts/clean_temps.ps1
            git status --short
            git add -- htfa/monitoring/uae/assets/uae.duckdb htfa/monitoring/uae/assets/阿联酋.xlsx
            if git diff --cached --quiet; then
              echo 'No new validated observations; no commit created.' >> "$GITHUB_STEP_SUMMARY"
              publication_complete=true
              break
            fi
            git commit -m 'chore: publish UAE and energy supply daily observations'
            git lfs push origin main
            git push origin main
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            python -m htfa.jobs.uae_data.verify_publication "$(git rev-parse HEAD)" | tee "$RUNNER_TEMP/daily-refresh/remote-verification.json"
            echo "Published and verified $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
            publication_complete=true
            break
          done
          test "$publication_complete" = true
          test -z "$(git status --porcelain -- htfa/monitoring/uae/assets/uae.duckdb htfa/monitoring/uae/assets/阿联酋.xlsx)"
      - name: Report every source status
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'daily-refresh' / 'summary.json'
          if not path.exists():
              raise SystemExit('Refresh did not produce a result; inspect collection logs.')
          result = json.loads(path.read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n| Source | Status |\n| --- | --- |\n')
              for name, source in result['sources'].items():
                  out.write(f"| {name} | {source.get('status', 'ok')} |\n")
                  for kind, detail in source.get('source_results', {}).items():
                      out.write(f"| energy/{kind} | {detail['status']} |\n")
          if result['status'] != 'ok':
              raise SystemExit('Some sources failed; validated successful sources were preserved. See artifacts for exact errors.')
      - name: Save source results and collection logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily-refresh
          retention-days: 14
          if-no-files-found: warn
