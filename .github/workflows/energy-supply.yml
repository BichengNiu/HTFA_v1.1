name: Publish HTFA energy supply data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/energy-supply.yml'
      - 'tooling/requirements/requirements-energy-collector.txt'
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Retry pending sources or collect all sources
        type: choice
        default: retry
        options: [retry, collect]

permissions:
  contents: write

concurrency:
  group: htfa-main-writer
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tooling/requirements/requirements-energy-collector.txt
      - name: Install collection and workbook dependencies
        run: python -m pip install -r tooling/requirements/requirements-energy-collector.txt
      - name: Collect and validate the database and workbook together
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git pull --ff-only origin main
            git lfs pull --include=data/UAE/uae.duckdb
            base=$(git rev-parse HEAD)
            args=()
            if [[ "$REQUESTED_MODE" == collect ]]; then args+=(--collect); fi
            python -m htfa.jobs.energy_supply.publish --publish "${args[@]}"
            git fetch origin main
            if [[ "$base" != "$(git rev-parse origin/main)" ]]; then
              git restore --source=HEAD -- data/UAE/uae.duckdb data/UAE/阿联酋.xlsx
              continue
            fi
            pwsh -NoProfile -File tooling/scripts/clean_temps.ps1
            git status --short
            git add -- data/UAE/uae.duckdb data/UAE/阿联酋.xlsx
            if git diff --cached --quiet; then
              echo 'No new validated observations; no commit created.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -m 'chore: publish validated energy supply observations'
            git lfs push origin main
            git push origin main
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            echo "Published and verified $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done
          echo 'main changed during each collection attempt; no data pushed.' >&2
          exit 1
