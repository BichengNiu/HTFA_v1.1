name: Diagnose UAE source endpoints

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Collector host for comparing network and platform compatibility
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-slim
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
        default: ubuntu-latest
      verify_updates:
        description: Verify labour and daily market collection against an isolated snapshot
        type: boolean
        default: false
      verify_sources:
        description: Comma-separated source names to verify
        type: string
        default: foreign_labour,public_market
      browser:
        description: Compare native browser requests with the HTTP downloader
        type: boolean
        default: false
      data_dubai:
        description: Verify Data Dubai portal session and official download requests
        type: boolean
        default: false
      data_dubai_api:
        description: Verify the three official dataset grants using repository Secrets
        type: boolean
        default: false
      network:
        description: Compare DNS, TLS and identical anonymous requests
        type: boolean
        default: false
      python_version:
        description: Python version for controlled runtime comparisons
        type: string
        default: '3.13'
      data_dubai_proxy:
        description: Verify configured proxy manifests and direct CDN downloads
        type: boolean
        default: false
      test_proxy:
        description: Run source proxy, rollback and download regression tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.13' }}
      - name: Install collector dependencies
        run: python -m pip install -r tooling/requirements/requirements-daily-collector.txt
      - name: Inspect public source responses from the runner
        if: ${{ !inputs.data_dubai && !inputs.data_dubai_api && !inputs.network && !inputs.data_dubai_proxy && !inputs.test_proxy }}
        run: python -m htfa.monitoring.uae.jobs.diagnose_endpoints
      - name: Compare network, TLS and identical request bytes
        if: inputs.network
        run: python -m htfa.monitoring.uae.jobs.diagnose_endpoints --network
      - name: Verify Data Dubai proxy and direct CDN downloads
        if: inputs.data_dubai_proxy
        env:
          HTFA_DATA_DUBAI_PROXY_URL: ${{ secrets.HTFA_DATA_DUBAI_PROXY_URL }}
        run: python -m htfa.monitoring.uae.jobs.data_dubai_proxy
      - name: Run proxy and source integrity regression tests
        if: inputs.test_proxy
        run: |
          python -m pip install pytest
          python -m pytest -c tooling/pytest.ini tests/jobs/test_data_dubai_proxy.py tests/jobs/test_daily_refresh.py tests/test_source_ded.py tests/test_source_dld.py tests/test_source_dubai_customs_air.py tests/test_dubai_customs_download.py -q
      - name: Verify Data Dubai session and download interfaces
        if: inputs.data_dubai
        run: python -m htfa.monitoring.uae.jobs.diagnose_endpoints --data-dubai
      - name: Verify official Data Dubai OAuth and dataset grants
        if: inputs.data_dubai_api
        env:
          DATA_DUBAI_API_KEY: ${{ secrets.DATA_DUBAI_API_KEY }}
          DATA_DUBAI_API_SECRET: ${{ secrets.DATA_DUBAI_API_SECRET }}
        run: python -m htfa.monitoring.uae.jobs.verify_data_dubai_access
      - name: Install native browser
        if: inputs.browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Compare native browser responses
        if: inputs.browser
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python -m htfa.monitoring.uae.jobs.diagnose_endpoints --browser
          else
            python -m htfa.monitoring.uae.jobs.diagnose_endpoints --browser
          fi
      - name: Verify download, database, workbook and history validation
        if: inputs.verify_updates
        env:
          HTFA_UAE_DATA_DIR: ${{ runner.temp }}/source-verification-data
          GH_TOKEN: ${{ github.token }}
          VERIFY_SOURCES: ${{ inputs.verify_sources }}
          HTFA_DATA_DUBAI_PROXY_URL: ${{ secrets.HTFA_DATA_DUBAI_PROXY_URL }}
        run: python -m htfa.monitoring.uae.jobs.diagnose_endpoints --verify-updates
      - name: Save verification results
        if: always() && inputs.verify_updates
        uses: actions/upload-artifact@v4
        with:
          name: source-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/source-verification
          retention-days: 14
      - name: Save proxy verification result
        if: always() && inputs.data_dubai_proxy
        uses: actions/upload-artifact@v4
        with:
          name: proxy-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/data-dubai-proxy-verification.json
          retention-days: 14
