name: Diagnose UAE source endpoints

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Collector host for comparing network and platform compatibility
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
        default: ubuntu-latest
      verify_updates:
        description: Verify labour and daily market collection against an isolated snapshot
        type: boolean
        default: false
      verify_sources:
        description: Comma-separated source names to verify
        type: string
        default: foreign_labour,public_market
      browser:
        description: Compare native browser requests with the HTTP downloader
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install collector dependencies
        run: python -m pip install -r tooling/requirements/requirements-daily-collector.txt
      - name: Inspect public source responses from the runner
        run: python -m htfa.monitoring.uae.jobs.diagnose_endpoints
      - name: Install native browser
        if: inputs.browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Compare native browser responses
        if: inputs.browser
        run: python -m htfa.monitoring.uae.jobs.diagnose_endpoints --browser
      - name: Verify download, database, workbook and history validation
        if: inputs.verify_updates
        env:
          HTFA_UAE_DATA_DIR: ${{ runner.temp }}/source-verification-data
          GH_TOKEN: ${{ github.token }}
          VERIFY_SOURCES: ${{ inputs.verify_sources }}
        run: python -m htfa.monitoring.uae.jobs.diagnose_endpoints --verify-updates
      - name: Save verification results
        if: always() && inputs.verify_updates
        uses: actions/upload-artifact@v4
        with:
          name: source-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/source-verification
          retention-days: 14
