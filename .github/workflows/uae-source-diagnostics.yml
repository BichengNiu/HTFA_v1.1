name: UAE public source diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uae-source-diagnostics.yml'
      - 'scripts/diagnose_uae_sources.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
      - run: python -m pip install --disable-pip-version-check curl_cffi==0.16.3
      - name: Inspect public endpoint responses without refreshing data
        run: python scripts/diagnose_uae_sources.py --output "$RUNNER_TEMP/uae-source-diagnostics.json"
      - uses: actions/upload-artifact@v4
        with:
          name: uae-source-diagnostics
          path: ${{ runner.temp }}/uae-source-diagnostics.json
          retention-days: 7
