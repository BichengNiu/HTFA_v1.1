name: HTFA data refresh and keepalive

on:
  schedule:
    # UTC 00:17, 06:17, 12:17, 18:17; Dubai 04:17, 10:17, 16:17, 22:17.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Retry data refresh even if today already succeeded'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/streamlit-keepalive.yml'
      - 'scripts/cloud_keepalive.py'
      - 'tooling/requirements/requirements-keepalive.txt'
      - 'scripts/cloud_refresh.py'
      - 'htfa/jobs/uae_data/cloud_worker.py'
      - 'htfa/jobs/uae_data/portable_workbook.py'
      - 'htfa/jobs/uae_data/download_uae_years.mjs'
      - 'htfa/jobs/uae_data/download_t100.py'

permissions:
  contents: write

concurrency:
  group: htfa-streamlit-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
          cache: pip
          cache-dependency-path: |
            tooling/requirements/requirements-keepalive.txt
            tooling/requirements/requirements-py313.lock
      - name: Plan daily data refresh
        id: refresh_plan
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          if [ "$FORCE_REFRESH" = true ]; then
            python scripts/cloud_refresh.py plan --force
          else
            python scripts/cloud_refresh.py plan
          fi
      - name: Install browser automation
        run: |
          python -m pip install --disable-pip-version-check -r tooling/requirements/requirements-keepalive.txt
          python -m playwright install --with-deps chromium
      - name: Prepare data refresh runtime and baseline
        id: refresh_runtime
        if: steps.refresh_plan.outputs.due == 'true'
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check -r tooling/requirements/requirements-py313.lock
          python scripts/htfa.py install-ts
          git lfs install --local
          git lfs pull --include=data/UAE/uae.duckdb
          git lfs checkout data/UAE/uae.duckdb
      - name: Refresh monthly-page sources in an isolated database
        id: data_refresh
        if: steps.refresh_plan.outputs.due == 'true' && steps.refresh_runtime.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          export WAM_CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python scripts/cloud_refresh.py run --result "$RUNNER_TEMP/htfa-refresh-result.json"
      - name: Clean, push data or empty commit, and verify remote main
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File tooling/scripts/clean_temps.ps1
          test "$(git branch --show-current)" = main
          git status --short
          test -z "$(git ls-files --others --exclude-standard)"
          python -c 'import subprocess; paths=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()); assert paths <= {"data/UAE/uae.duckdb"}, paths'
          if git diff --quiet; then
            git pull --ff-only origin main
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/UAE/uae.duckdb
          if git diff --cached --quiet; then
            git commit --allow-empty -m 'chore: Streamlit keep-alive'
          else
            refresh_date=$(python -c 'import json,os; from pathlib import Path; result=json.loads((Path(os.environ["RUNNER_TEMP"])/"htfa-refresh-result.json").read_text()); assert result["status"]=="refreshed"; print(result["date"])')
            git commit -m "data: refresh UAE monthly data $refresh_date"
            git lfs push origin main
          fi
          pushed_commit=$(git rev-parse HEAD)
          git push origin main
          git fetch origin main
          git merge-base --is-ancestor "$pushed_commit" origin/main
          git merge --ff-only origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Verified remote maintenance commit: $pushed_commit"
          echo "Maintenance commit pushed and verified: $pushed_commit" >> "$GITHUB_STEP_SUMMARY"
      - name: Wake HTFA and verify real application content
        if: always()
        run: |
          python scripts/cloud_keepalive.py --timeout 180 --hold-seconds 15 --screenshot "$RUNNER_TEMP/htfa-keepalive-failure.png"
          echo 'HTFA heading and metric verified in Chromium; session remained active.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report data refresh failures without disabling keepalive
        if: always() && (steps.refresh_runtime.outcome == 'failure' || steps.data_refresh.outcome == 'failure')
        run: |
          echo 'Data refresh FAILED; the previous published database was retained. Check the refresh logs.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Save failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: htfa-keepalive-failure
          path: |
            ${{ runner.temp }}/htfa-keepalive-failure.png
            ${{ runner.temp }}/htfa-refresh-result.json
          if-no-files-found: ignore
          retention-days: 3
